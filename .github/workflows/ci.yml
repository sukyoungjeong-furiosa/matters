name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: Source/Editor/package.json
      - name: Install editor dependencies
        run: pnpm --dir Source/Editor install --frozen-lockfile --ignore-scripts
      - name: Rebuild and verify the bundled editor
        run: |
          pnpm --dir Source/Editor build
          pnpm --dir Source/Editor test
          git diff --exit-code -- Source/Resources
      - name: Verify native behavior
        run: ./Test.command
      - name: Build and sign the app locally
        run: ./Build.command
