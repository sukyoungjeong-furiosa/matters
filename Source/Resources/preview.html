<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src matters-asset: https: http: data:; style-src 'unsafe-inline'; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme: light dark; --muted:#717775; --line:#dde4e1; --code:#f3f6f4; --accent:#297667; }
@media (prefers-color-scheme: dark) { :root { --muted:#a4aea9; --line:#39433e; --code:#242c28; --accent:#83c8ae; } }
* { box-sizing:border-box; }
html { background:Canvas; color:CanvasText; }
body { margin:0; font:15px/1.8 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; overflow-wrap:anywhere; }
main { max-width:880px; margin:auto; min-height:100vh; padding:28px 34px 72px; }
h1,h2,h3,h4,h5,h6 { line-height:1.4; margin:1.5em 0 .6em; font-weight:650; }
h1 { font-size:2em; padding-bottom:.25em; border-bottom:1px solid var(--line); }
h2 { font-size:1.55em; } h3 { font-size:1.25em; }
main > :first-child { margin-top:0; } p { margin:.7em 0 1em; }
ul,ol { padding-left:1.7em; } li { margin:.25em 0; } li > p { margin:.3em 0; }
blockquote { margin:1em 0; border-left:3px solid var(--accent); padding:.1em 1.1em; color:var(--muted); }
a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px; }
code,kbd,pre { font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; }
code { background:var(--code); padding:.15em .35em; border-radius:4px; }
pre { background:var(--code); padding:16px 18px; border:1px solid var(--line); border-radius:10px; overflow:auto; overflow-wrap:normal; }
pre code { padding:0; background:none; } kbd { border:1px solid var(--line); padding:.1em .4em; border-radius:4px; }
table { display:block; max-width:100%; overflow-x:auto; border-collapse:collapse; margin:1.2em 0; }
th,td { border:1px solid var(--line); padding:8px 13px; min-width:80px; } th { background:var(--code); text-align:left; }
hr { border:0; border-top:1px solid var(--line); margin:1.7em 0; }
img { max-width:100%; height:auto; border-radius:6px; }
input[type=checkbox] { accent-color:var(--accent); vertical-align:middle; margin-right:7px; }
details { border:1px solid var(--line); border-radius:8px; padding:10px 14px; } summary { cursor:pointer; }
.empty { color:var(--muted); padding-top:20px; }

#toolbar { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:5px; padding:9px 16px; background:Canvas; border-bottom:1px solid var(--line); }
button { color:CanvasText; background:var(--code); border:1px solid var(--line); border-radius:5px; padding:5px 9px; cursor:pointer; font:12px -apple-system,sans-serif; } button:hover { border-color:var(--accent); } [hidden] { display:none !important; }
#properties { color:var(--muted); font-size:12px; padding:8px 34px; }
.tiptap { outline:none; min-height:65vh; } .tiptap > :first-child { margin-top:0; }
table { display:table; table-layout:fixed; width:100%; margin:0; } .tableWrapper { overflow-x:auto; margin:1em 0; } td,th { position:relative; vertical-align:top; min-width:90px; } td p,th p { margin:0; min-height:1.8em; }
.selectedCell:after { content:""; position:absolute; inset:0; background:rgba(60,145,120,.18); pointer-events:none; }
ul[data-type=taskList] { list-style:none; padding-left:.25em; } li[data-type=taskItem] { display:flex; align-items:baseline; gap:7px; } li[data-type=taskItem]>div { flex:1; }
.raw-block { border:1px dashed var(--line); border-radius:6px; color:var(--muted); } .raw-block pre { white-space:pre-wrap; margin:0; }
</style></head><body><nav id="toolbar" aria-label="문서 서식"></nav><aside id="properties" hidden>문서 속성은 원문 모드에서 편집할 수 있어요.</aside><main id="content"></main></body></html>
